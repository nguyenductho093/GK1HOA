<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Luyện thi Hóa học</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- MathJax for Chemistry Formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .math-text { font-family: "Times New Roman", Times, serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const examData = {
            part1: [
                { id: 'p1q1', text: 'Saccharose là một disaccharide. Phát biểu nào sau đây về saccharose là đúng?', options: ['A. Saccharose không bị thuỷ phân trong môi trường acid.', 'B. Thuỷ phân saccharose chỉ thu được fructose.', 'C. Thuỷ phân saccharose chỉ thu được glucose.', 'D. Thuỷ phân saccharose thu được cả glucose và fructose.'], correct: 3, explanation: 'Saccharose khi bị thủy phân trong môi trường acid sẽ thu được hỗn hợp gồm α-glucose và β-fructose.' },
                { id: 'p1q2', text: 'Nguyên liệu nào sau đây không phải là nguồn cung cấp tinh bột?', options: ['A. Gạo.', 'B. Hạt ngũ cốc.', 'C. Sợi bông.', 'D. Củ và quả.'], correct: 2, explanation: 'Sợi bông có thành phần chủ yếu là cellulose (khoảng 98%), không phải là tinh bột.' },
                { id: 'p1q3', text: 'Ester X được tạo bởi ethyl alcohol và acetic acid. Công thức của X là', options: ['A. CH3COOCH3.', 'B. HCOOC2H5.', 'C. HCOOCH3.', 'D. CH3COOC2H5.'], correct: 3, explanation: 'Phản ứng ester hóa giữa C2H5OH và CH3COOH tạo ra ethyl acetate: CH3COOC2H5.' },
                { id: 'p1q4', text: 'Docosahexaenoic acid (DHA) có nối đôi đầu tiên ở vị trí carbon số 3 tính từ đầu methyl. DHA là một acid béo thuộc nhóm:', options: ['A. omega-9.', 'B. omega-6.', 'C. omega-7.', 'D. omega-3.'], correct: 3, explanation: 'Nối đôi đầu tiên xuất hiện ở vị trí carbon số 3 từ đầu omega (nhóm CH3), nên thuộc nhóm omega-3.' },
                { id: 'p1q5', text: 'Chất nào sau đây là thành phần chủ yếu của xà phòng?', options: ['A. CH3(CH2)3COONa.', 'B. CH3COONa.', 'C. C17H35COONa.', 'D. CH2=CHCOONa.'], correct: 2, explanation: 'Xà phòng là muối sodium hoặc potassium của acid béo (mạch carbon dài, C17H35COONa là sodium stearate).' },
                { id: 'p1q6', text: 'Chất X thường sử dụng để sản xuất bia và chủ yếu được tạo ra trong quá trình thủy phân tinh bột. Chất X là', options: ['A. Fructose.', 'B. Saccharose.', 'C. Maltose.', 'D. Glucose.'], correct: 2, explanation: 'Tinh bột từ mầm lúa mạch được thủy phân thành maltose để lên men tạo bia.' },
                { id: 'p1q7', text: 'Amine nào sau đây là amine bậc hai?', options: ['A. (CH3)3N.', 'B. CH3CH2CH2NH2.', 'C. CH3NHCH2CH3.', 'D. CH3CH(NH2)CH3.'], correct: 2, explanation: 'Amine bậc hai có nhóm -NH- liên kết với 2 gốc hydrocarbon. CH3NHCH2CH3 là amine bậc 2.' },
                { id: 'p1q8', text: 'Amine nào sau đây ở trạng thái lỏng ở nhiệt độ phòng?', options: ['A. Dimethylamine.', 'B. Ethylamine.', 'C. Methylamine.', 'D. Aniline.'], correct: 3, explanation: 'Aniline là chất lỏng ở điều kiện thường. Các chất còn lại là chất khí.' },
                { id: 'p1q9', text: 'Khi bị ốm, mất sức, nhiều người bệnh thường được truyền dịch đường để bổ sung nhanh năng lượng. Chất trong dịch truyền có tác dụng trên là', options: ['A. Maltose.', 'B. Glucose.', 'C. Saccharose.', 'D. Fructose.'], correct: 1, explanation: 'Dịch truyền phổ biến là dung dịch glucose 5%.' },
                { id: 'p1q10', text: 'Cellulose thuộc loại polysaccharide, là thành phần chính tạo nên màng tế bào thực vật. Công thức của cellulose là', options: ['A. C2H4O2.', 'B. C12H22O11.', 'C. C6H12O6.', 'D. (C6H10O5)n.'], correct: 3, explanation: 'Công thức chung của cellulose là (C6H10O5)n.' }
                // Rút gọn 10 câu Phần 1 để làm mẫu cấu trúc.
            ],
            part2: [
                {
                    id: 'p2q1', text: 'Cho ester X có công thức: CH3COOCH3',
                    statements: [
                        { id: 'a', text: 'a) Tên gọi của X là methyl acetate.', correct: true, explanation: 'CH3COOCH3 có gốc acid là acetate, gốc alcohol là methyl.' },
                        { id: 'b', text: 'b) Phần trăm khối lượng của nguyên tố carbon trong X là 48,86%', correct: false, explanation: 'M = 74. %C = (12*3/74)*100% ≈ 48,65%.' },
                        { id: 'c', text: 'c) Thủy phân X trong môi trường acid thu được acid và alcohol có công thức phân tử giống nhau.', correct: false, explanation: 'Thu được CH3COOH (C2H4O2) và CH3OH (CH4O) khác nhau.' },
                        { id: 'd', text: 'd) Để tăng hiệu suất phản ứng điều chế X ta dùng H2SO4 đặc và dùng dư acid hoặc alcohol.', correct: true, explanation: 'H2SO4 đặc hút nước và dùng dư chất tham gia giúp cân bằng chuyển dịch theo chiều thuận.' }
                    ]
                },
                {
                    id: 'p2q2', text: 'Glucose có tính chất hóa học của alcohol đa chức và aldehyde.',
                    statements: [
                        { id: 'a', text: 'a) Glucose có khả năng hòa tan Cu(OH)2 trong môi trường kiềm tạo thành dung dịch có màu xanh lam ở điều kiện thường.', correct: true, explanation: 'Do có nhiều nhóm OH kề nhau.' },
                        { id: 'b', text: 'b) Glucose thuộc loại disaccharide nên có phản ứng thủy phân.', correct: false, explanation: 'Glucose là monosaccharide, không bị thủy phân.' },
                        { id: 'c', text: 'c) Khi đun nóng, glucose có phản ứng với Cu(OH)2 trong môi trường kiềm tạo kết tủa vàng.', correct: false, explanation: 'Tạo kết tủa Cu2O màu đỏ gạch, không phải màu vàng.' },
                        { id: 'd', text: 'd) Glucose làm mất màu nước bromine ở điều kiện thường do có nhiều nhóm OH.', correct: false, explanation: 'Làm mất màu do có nhóm chức aldehyde (-CHO).' }
                    ]
                }
            ],
            part3: [
                { id: 'p3q1', text: 'Cho các chất: (1) methyl acetate; (2) propyl acetate; (3) sodium formate; (4) sodium palmitate; (5) methyl methacrylate; (6) methyl formate. Liệt kê theo trình tự từ nhỏ đến lớn các số ứng với tất cả các chất là ester (viết liền).', correct: '1256', explanation: 'Các ester là 1, 2, 5, 6. Chất 3 và 4 là muối.' },
                { id: 'p3q2', text: 'Số đồng phân amine có công thức phân tử C4H11N là bao nhiêu?', correct: '8', explanation: 'Có 4 đồng phân bậc 1, 3 đồng phân bậc 2, và 1 đồng phân bậc 3. Tổng là 8.' },
                { id: 'p3q3', text: 'Để thu được 27 kg glucose cần thủy phân m kg saccharose với hiệu suất 60%. Giá trị của m là bao nhiêu?', correct: '85.5', explanation: 'm (lý thuyết) = 27*342/180 = 51,3 kg. m (thực tế) = 51,3 / 0,6 = 85,5 kg.' }
            ]
        };

        function App() {
            const [answers, setAnswers] = React.useState({});
            const [submitted, setSubmitted] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [timeLeft, setTimeLeft] = React.useState(50 * 60); // 50 minutes

            React.useEffect(() => {
                if (timeLeft > 0 && !submitted) {
                    const timerId = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                    return () => clearTimeout(timerId);
                } else if (timeLeft === 0 && !submitted) {
                    handleSubmit();
                }
            }, [timeLeft, submitted]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleRadioChange = (qId, optionIndex) => {
                if(submitted) return;
                setAnswers({ ...answers, [qId]: optionIndex });
            };

            const handleTFChange = (qId, statementId, value) => {
                if(submitted) return;
                setAnswers({ ...answers, [`${qId}_${statementId}`]: value });
            };

            const handleTextChange = (qId, value) => {
                if(submitted) return;
                setAnswers({ ...answers, [qId]: value.trim() });
            };

            const handleSubmit = () => {
                let totalScore = 0;
                
                // Chấm điểm Phần 1 (0.25đ / câu) - Trọng số mẫu do rút gọn đề
                examData.part1.forEach(q => {
                    if (answers[q.id] === q.correct) totalScore += 0.25;
                });

                // Chấm điểm Phần 2
                examData.part2.forEach(q => {
                    let correctCount = 0;
                    q.statements.forEach(st => {
                        if (answers[`${q.id}_${st.id}`] === st.correct) correctCount++;
                    });
                    if (correctCount === 1) totalScore += 0.1;
                    else if (correctCount === 2) totalScore += 0.25;
                    else if (correctCount === 3) totalScore += 0.5;
                    else if (correctCount === 4) totalScore += 1.0;
                });

                // Chấm điểm Phần 3 (0.25đ / câu)
                examData.part3.forEach(q => {
                    if (answers[q.id] && answers[q.id].replace(',', '.') === q.correct.toString()) {
                        totalScore += 0.25;
                    }
                });

                setScore(totalScore);
                setSubmitted(true);
                setTimeout(() => { if(window.MathJax) MathJax.typeset(); }, 100);
            };

            return (
                <div className="max-w-5xl mx-auto p-4 flex flex-col md:flex-row gap-6">
                    {/* Bảng điều khiển */}
                    <div className="md:w-1/4 bg-white p-4 rounded-lg shadow-md h-fit sticky top-4">
                        <h2 className="text-xl font-bold mb-4 text-blue-700">Đồng hồ: {formatTime(timeLeft)}</h2>
                        <button 
                            onClick={handleSubmit} 
                            disabled={submitted}
                            className={`w-full py-2 px-4 rounded text-white font-bold mb-4 ${submitted ? 'bg-gray-400' : 'bg-red-500 hover:bg-red-600'}`}>
                            {submitted ? 'ĐÃ NỘP BÀI' : 'NỘP BÀI'}
                        </button>
                        
                        {submitted && (
                            <div className="bg-green-100 p-4 rounded-lg mb-4 text-center">
                                <h3 className="text-lg font-bold">Điểm số ước tính</h3>
                                <p className="text-3xl text-green-700 font-black">{score.toFixed(2)}</p>
                            </div>
                        )}

                        <h3 className="font-bold mb-2">Trạng thái:</h3>
                        <div className="flex flex-wrap gap-2">
                            {examData.part1.map((q, idx) => (
                                <a key={q.id} href={`#${q.id}`} 
                                   className={`w-8 h-8 flex items-center justify-center rounded border text-sm font-bold
                                   ${submitted 
                                        ? (answers[q.id] === q.correct ? 'bg-green-500 text-white' : 'bg-red-500 text-white') 
                                        : (answers[q.id] !== undefined ? 'bg-blue-500 text-white' : 'bg-white text-gray-700')}`}>
                                    {idx + 1}
                                </a>
                            ))}
                        </div>
                    </div>

                    {/* Nội dung đề thi */}
                    <div className="md:w-3/4 bg-white p-6 rounded-lg shadow-md">
                        <h1 className="text-2xl font-bold text-center mb-6 uppercase">Đề Kiểm Tra Hóa Học</h1>
                        
                        {/* PHẦN 1 */}
                        <h2 className="text-xl font-bold mb-4 border-b-2 border-blue-500 pb-2">PHẦN 1: TRẮC NGHIỆM NHIỀU PHƯƠNG ÁN LỰA CHỌN</h2>
                        {examData.part1.map((q, idx) => (
                            <div key={q.id} id={q.id} className="mb-6 p-4 rounded bg-gray-50">
                                <p className="font-bold mb-2">Câu {idx + 1}: <span className="font-normal">{q.text}</span></p>
                                <div className="space-y-2 pl-4">
                                    {q.options.map((opt, oIdx) => (
                                        <label key={oIdx} className="flex items-start cursor-pointer group">
                                            <input type="radio" name={q.id} 
                                                   checked={answers[q.id] === oIdx}
                                                   onChange={() => handleRadioChange(q.id, oIdx)}
                                                   disabled={submitted}
                                                   className="mt-1 mr-2 cursor-pointer" />
                                            <span className={`${submitted && q.correct === oIdx ? 'text-green-600 font-bold' : ''}`}>{opt}</span>
                                        </label>
                                    ))}
                                </div>
                                {submitted && (
                                    <div className="mt-3 p-3 bg-blue-100 border-l-4 border-blue-500 rounded text-sm">
                                        <span className="font-bold text-blue-700">Giải thích: </span>{q.explanation}
                                    </div>
                                )}
                            </div>
                        ))}

                        {/* PHẦN 2 */}
                        <h2 className="text-xl font-bold mb-4 mt-8 border-b-2 border-blue-500 pb-2">PHẦN 2: TRẮC NGHIỆM ĐÚNG SAI</h2>
                        {examData.part2.map((q, idx) => (
                            <div key={q.id} id={q.id} className="mb-6 p-4 rounded bg-gray-50">
                                <p className="font-bold mb-3">Câu {idx + 1}: <span className="font-normal">{q.text}</span></p>
                                <div className="space-y-4 pl-2">
                                    {q.statements.map((st) => {
                                        const stateKey = `${q.id}_${st.id}`;
                                        const isCorrect = answers[stateKey] === st.correct;
                                        return (
                                            <div key={st.id} className="border-b pb-2">
                                                <p className="mb-2">{st.text}</p>
                                                <div className="flex gap-4">
                                                    <label className="flex items-center cursor-pointer">
                                                        <input type="radio" name={stateKey} checked={answers[stateKey] === true} onChange={() => handleTFChange(q.id, st.id, true)} disabled={submitted} className="mr-1"/> Đúng
                                                    </label>
                                                    <label className="flex items-center cursor-pointer">
                                                        <input type="radio" name={stateKey} checked={answers[stateKey] === false} onChange={() => handleTFChange(q.id, st.id, false)} disabled={submitted} className="mr-1"/> Sai
                                                    </label>
                                                </div>
                                                {submitted && (
                                                    <div className={`mt-2 text-sm p-2 rounded ${isCorrect ? 'bg-green-100' : 'bg-red-100'}`}>
                                                        <span className="font-bold">Đáp án đúng là: {st.correct ? 'ĐÚNG' : 'SAI'}. </span>
                                                        {st.explanation}
                                                    </div>
                                                )}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        ))}

                        {/* PHẦN 3 */}
                        <h2 className="text-xl font-bold mb-4 mt-8 border-b-2 border-blue-500 pb-2">PHẦN 3: TRẢ LỜI NGẮN</h2>
                        {examData.part3.map((q, idx) => (
                            <div key={q.id} id={q.id} className="mb-6 p-4 rounded bg-gray-50">
                                <p className="font-bold mb-2">Câu {idx + 1}: <span className="font-normal">{q.text}</span></p>
                                <input type="text" 
                                       placeholder="Nhập đáp án..."
                                       value={answers[q.id] || ''}
                                       onChange={(e) => handleTextChange(q.id, e.target.value)}
                                       disabled={submitted}
                                       className="border border-gray-300 p-2 rounded w-full md:w-1/2 focus:outline-none focus:border-blue-500"/>
                                {submitted && (
                                    <div className={`mt-3 p-3 rounded text-sm ${answers[q.id] == q.correct ? 'bg-green-100' : 'bg-red-100'}`}>
                                        <p><span className="font-bold">Đáp án của đề: </span> <span className="font-black">{q.correct}</span></p>
                                        <p className="mt-1 text-gray-700">{q.explanation}</p>
                                    </div>
                                )}
                            </div>
                        ))}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
```eof

Tất cả code, giao diện và nội dung đều được gói gọn trong file HTML trên. Bạn chỉ cần tải file về và nhấn đúp chuột (mở bằng Chrome/Cốc Cốc/Edge) là có thể sử dụng được ngay mà không cần cài đặt thêm phần mềm nào khác! Chúc bạn ôn tập tốt.
